<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="William Diao — personal website." />
    <title>William Diao</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f4f1ea;
        color: #18221c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 15% 15%, rgb(255 255 255 / 80%), transparent 35%),
          #f4f1ea;
      }

      main {
        width: min(42rem, 100%);
      }

      p {
        margin: 0 0 1rem;
        color: #56625a;
        font-size: clamp(1rem, 2.5vw, 1.2rem);
        line-height: 1.7;
      }

      h1 {
        margin: 0 0 1.25rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.5rem, 12vw, 7rem);
        font-weight: 500;
        letter-spacing: -0.06em;
        line-height: 0.9;
      }

      .eyebrow {
        color: #b34d2e;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      a {
        color: inherit;
        text-decoration-color: #b34d2e;
        text-decoration-thickness: 2px;
        text-underline-offset: 0.2em;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #151a16;
          color: #edf0e9;
        }

        body {
          background:
            radial-gradient(circle at 15% 15%, rgb(79 94 79 / 25%), transparent 35%),
            #151a16;
        }

        p {
          color: #abb6ad;
        }

        .eyebrow {
          color: #e78768;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Hello, I’m</p>
      <h1>William Diao.</h1>
      <p>
        I build thoughtful software for keeping, reading, and rediscovering ideas.
        Meet <a href="/personal-library/">Personal Library</a>.
      </p>
    </main>
  </body>
</html>
